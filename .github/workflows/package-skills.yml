name: Package Skills

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package each skill as a zip
        run: |
          mkdir -p dist/skills
          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")
            (cd skills && zip -r "../dist/skills/${skill_name}.zip" "$skill_name/")
            echo "Packaged: ${skill_name}.zip"
          done
          echo "--- All skill zips ---"
          ls -lh dist/skills/

      - name: Upload skill zips as release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for zip in dist/skills/*.zip; do
            gh release upload "${{ github.event.release.tag_name }}" "$zip" --clobber
            echo "Uploaded: $(basename "$zip")"
          done

      - name: Upload skill zips as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skill-zips
          path: dist/skills/*.zip
